[project]
name = "trevorspray"
version = "2.4.0"
description = "A modular password sprayer with threading, SSH proxying, loot modules, and more"
authors = [{ name = "TheTechromancer" }]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "pygments>=2.19.1,<3",
    "sh>=2.2.1,<3",
    "pysocks>=1.7.1,<2",
    "exchangelib>=5.5.0,<6",
    "trevorproxy>=1.0.8,<2",
    "tldextract>=5.1.3,<6",
    "beautifulsoup4>=4.12.3,<5",
    "mechanicalsoup>=1.3.0,<2",
]

[project.urls]
Homepage = "https://github.com/blacklanternsecurity/TREVORspray"
Repository = "https://github.com/blacklanternsecurity/TREVORspray"

[project.scripts]
trevorspray = "trevorspray.cli:main"

[dependency-groups]
dev = [
    "flake8>=6.1.0,<7",
    "black>=23.7.0,<24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
